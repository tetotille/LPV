[tool.poetry]
name = "yolo-fastapi-server"
version = "0.1.0"
description = "Servidor FastAPI para inferencia YOLO ONNX sobre imagenes."
authors = ["Carlos Benitez <carlosbenitez@fiuna.edu.py>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.115.6"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
python-multipart = "^0.0.20"
onnxruntime = "^1.20.1"
numpy = "^2.1.3"
opencv-python-headless = "^4.10.0.84"
pillow = "^11.0.0"

[tool.poetry.scripts]
yolo-server = "app.main:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
