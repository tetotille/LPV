[tool.poetry]
name = "yolo-pyqt6-client"
version = "0.1.0"
description = "Cliente PyQt6 para capturar/enviar imagenes a un servidor FastAPI YOLO y visualizar detecciones."
authors = ["Carlos Benitez <carlosbenitez@fiuna.edu.py>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
requests = "^2.32.3"
opencv-python-headless = "^4.10.0.84"
numpy = "^2.1.3"

[tool.poetry.scripts]
yolo-client = "app.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
