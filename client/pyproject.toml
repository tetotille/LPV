[tool.poetry]
name = "motor-monitor-client"
version = "0.1.0"
description = "Cliente PyQt6 para monitoreo en tiempo real de un motor simulado"
authors = ["Carlos"]
packages = [{ include = "src/motor_client" }]

[tool.poetry.dependencies]
python = "^3.11"
PyQt6 = "^6.6"
pyqtgraph = "^0.13"
requests = "^2.31"

[tool.poetry.scripts]
motor-client = "src.motor_client.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
